name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Run Assignment1 tests
        run: mvn -f Assignment1/pom.xml -ntp test
      - name: Run Server2 tests
        run: mvn -f Server2/pom.xml -ntp test
